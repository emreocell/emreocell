<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Let's build something that lasts.">
<title>Let's build something that lasts.</title>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0B"/><stop offset=".55" stop-color="#0D0E10"/><stop offset="1" stop-color="#121316"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F1EC"/><stop offset="1" stop-color="#C3CAD0"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="131"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="17" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".62"/></feComponentTransfer></filter>
</defs>
<style>
  .s{font-family:'Inter','Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:22;opacity:0}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite} .ring{animation:ring 2.4s ease-out infinite} .blink{animation:blink 1.1s step-end infinite}
</style>
<rect width="1600" height="640" fill="url(#base)"/>
<g filter="url(#blur)"><ellipse cx="800" cy="700" rx="760" ry="260" fill="#3D434B" opacity="1"/><ellipse cx="1400" cy="640" rx="400" ry="220" fill="#E4EBF0" opacity="0.32"/><ellipse cx="200" cy="100" rx="420" ry="200" fill="#2C3137" opacity="0.7"/><ellipse cx="900" cy="300" rx="260" ry="120" fill="#E4EBF0" opacity="0.08"/></g>
<rect width="1600" height="640" fill="url(#vig)"/>
<rect width="1600" height="640" filter="url(#grain)" opacity=".5" style="mix-blend-mode:overlay"/>
<rect width="1600" height="640" filter="url(#grain)" opacity=".06"/>

<text class="m" x="64" y="70" font-size="15" fill="#6B737B" text-anchor="start">( 05 )</text><text class="m" x="1536" y="70" font-size="15" fill="#6B737B" text-anchor="end">Contact</text><line x1="64" y1="96" x2="1536" y2="96" stroke="#FFFFFF" stroke-opacity="0.12"/>
<text class="s" x="56" y="270" font-size="132" font-weight="800" letter-spacing="-5" fill="url(#ink)">Let’s build something</text>
<text class="s" x="56" y="410" font-size="132" font-weight="800" letter-spacing="-5" fill="none" stroke="#E4EBF0" stroke-opacity=".85" stroke-width="2">that lasts.</text>
