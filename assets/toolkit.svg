<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-label="Toolkit">
<title>Toolkit</title>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0B"/><stop offset=".55" stop-color="#0D0E10"/><stop offset="1" stop-color="#121316"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F1EC"/><stop offset="1" stop-color="#C3CAD0"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="140"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="13" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".62"/></feComponentTransfer></filter>
</defs>
<style>
  .s{font-family:'Inter','Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{r:6;opacity:.7}100%{r:22;opacity:0}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite} .ring{animation:ring 2.4s ease-out infinite} .blink{animation:blink 1.1s step-end infinite}
</style>
<rect width="1600" height="700" fill="url(#base)"/>
<g filter="url(#blur)"><ellipse cx="1350" cy="120" rx="520" ry="260" fill="#3A4048" opacity="0.85"/><ellipse cx="180" cy="700" rx="520" ry="220" fill="#2C3137" opacity="0.95"/><ellipse cx="1500" cy="640" rx="320" ry="180" fill="#E4EBF0" opacity="0.18"/></g>
<rect width="1600" height="700" fill="url(#vig)"/>
<rect width="1600" height="700" filter="url(#grain)" opacity=".5" style="mix-blend-mode:overlay"/>
<rect width="1600" height="700" filter="url(#grain)" opacity=".06"/>
<text class="m" x="64" y="70" font-size="15" fill="#6B737B" text-anchor="start">( 03 )</text><text class="m" x="1536" y="70" font-size="15" fill="#6B737B" text-anchor="end">Tools I reach for</text><line x1="64" y1="96" x2="1536" y2="96" stroke="#FFFFFF" stroke-opacity="0.12"/>
<text class="s" x="58" y="194" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#ink)">Toolkit</text><text class="m" x="64" y="300" font-size="13" fill="#6B737B" text-anchor="start">01 — Languages</text>
<line x1="64" y1="322" x2="392" y2="322" stroke="#FFFFFF" stroke-opacity=".1"/>
<g class="s" font-size="29" fill="#F3F1EC"><text x="64" y="376" >Rust</text><text x="64" y="426" >Python</text><text x="64" y="476" >TypeScript</text><text x="64" y="526" >JavaScript</text><text x="64" y="576" fill="#9AA2AA">PHP</text><text x="64" y="626" fill="#9AA2AA">Java · C#</text></g>
<text class="m" x="432" y="300" font-size="13" fill="#6B737B" text-anchor="start">02 — Web &amp; Systems</text>
<line x1="432" y1="322" x2="760" y2="322" stroke="#FFFFFF" stroke-opacity=".1"/>
<g class="s" font-size="29" fill="#F3F1EC"><text x="432" y="376" >HTML &amp; CSS</text><text x="432" y="426" >Bootstrap</text><text x="432" y="476" >MySQL</text><text x="432" y="526" >Technical SEO</text><text x="432" y="576" fill="#9AA2AA">Core Web Vitals</text><text x="432" y="626" fill="#9AA2AA">E-commerce</text></g>
<text class="m" x="800" y="300" font-size="13" fill="#6B737B" text-anchor="start">03 — Realtime &amp; AI</text>
<line x1="800" y1="322" x2="1128" y2="322" stroke="#FFFFFF" stroke-opacity=".1"/>
<g class="s" font-size="29" fill="#F3F1EC"><text x="800" y="376" >LiveKit</text><text x="800" y="426" >WebRTC</text><text x="800" y="476" >Gemini Live</text><text x="800" y="526" >LLM agents</text><text x="800" y="576" fill="#9AA2AA">Local models</text><text x="800" y="626" fill="#9AA2AA">Ethereum</text></g>
<text class="m" x="1168" y="300" font-size="13" fill="#6B737B" text-anchor="start">04 — Tooling</text>
<line x1="1168" y1="322" x2="1496" y2="322" stroke="#FFFFFF" stroke-opacity=".1"/>
<g class="s" font-size="29" fill="#F3F1EC"><text x="1168" y="376" >Git</text><text x="1168" y="426" >GitHub Actions</text><text x="1168" y="476" >Docker</text><text x="1168" y="526" >Tauri</text><text x="1168" y="576" fill="#9AA2AA">Nginx &amp; Apache</text><text x="1168" y="626" fill="#9AA2AA">Linux</text></g>
</svg>
